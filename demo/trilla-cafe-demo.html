<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c3f">
<title>Trilla de café · Demostración</title>
<style>
:root{--bg:#eef1ea;--surf:#fbfcf8;--ink:#1c2a22;--mut:#5f6f64;--acc:#1f5c3f;--onacc:#fff;--line:#d3dacd;--bad:#a8242c;--bad-bg:#f8e4e5;--ok:#1f6b45;--ok-bg:#dcefe3;--warn:#8a5a12;--warn-bg:#f6ead2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--surf:#18211b;--ink:#e8efe6;--mut:#9db0a2;--acc:#7fcf9f;--onacc:#0f1511;--line:#2b392f;--bad:#f0888e;--bad-bg:#3a1d20;--ok:#7fcf9f;--ok-bg:#173323;--warn:#f0c072;--warn-bg:#3a2c12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1511;--surf:#18211b;--ink:#e8efe6;--mut:#9db0a2;--acc:#7fcf9f;--onacc:#0f1511;--line:#2b392f;--bad:#f0888e;--bad-bg:#3a1d20;--ok:#7fcf9f;--ok-bg:#173323;--warn:#f0c072;--warn-bg:#3a2c12;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:16px}
main.centro{max-width:440px;padding-top:6vh}
h1{font:600 22px Georgia,"Iowan Old Style",serif;margin:0 0 2px}
h2{font:600 18px Georgia,"Iowan Old Style",serif;margin:24px 0 8px}
a{color:var(--acc)}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.sub0{color:var(--mut);font-size:14px;margin:0}
.big{font:600 44px/1.1 Georgia,"Iowan Old Style",serif;margin:4px 0;font-variant-numeric:tabular-nums}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:10px 0 6px}
.bar i{display:block;background:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mut)}
.bloque{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.split{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bad{color:var(--bad)}.ok{color:var(--ok)}
small.bad{color:var(--bad)}small.ok{color:var(--ok)}
.tachado>*:first-child{opacity:.55;text-decoration:line-through}
.form{display:grid;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dos>div{display:grid;gap:6px}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;width:100%}
button{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button.link{background:none;border:0;padding:4px 0;width:auto;color:var(--acc);font-weight:500;text-decoration:underline;text-align:left}
button:disabled{opacity:.5;cursor:not-allowed}
.inl{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.inl>input,.inl>select{flex:1 1 150px;width:auto}.inl>button{width:auto;white-space:nowrap}
label{font-size:14px;color:var(--mut)}
.check{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px}.check input{width:auto;margin:3px 0 0}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end;margin-bottom:8px}
.filtros label.f{display:grid;gap:2px;font-size:12px}
.aviso{padding:10px 12px;border-radius:8px;font-size:14px;margin:0 0 12px}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}.aviso.bad{background:var(--bad-bg);color:var(--bad)}.aviso.warn{background:var(--warn-bg);color:var(--warn)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.tarjeta{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px}
.codigo{font:600 24px/1.2 ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:.2em;text-align:center}
.codigos{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-family:ui-monospace,"SF Mono",Consolas,monospace;padding:12px 12px 12px 32px;margin:8px 0;background:var(--surf);border:1px solid var(--line);border-radius:10px}
.personas{display:grid;gap:8px}
.persona{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.persona small{display:block;color:var(--mut);font-weight:400}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13px;border-bottom:1px solid var(--line)}
.demo>div{max-width:640px;margin:0 auto;padding:6px 16px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between}
.demo select{width:auto;padding:4px 8px;font-size:13px;background:var(--surf)}
header.cab{max-width:640px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
header.cab b{font:600 16px Georgia,serif}
header.cab nav{display:flex;gap:14px}
header.cab button{background:none;border:0;padding:0;width:auto;color:var(--mut);font-weight:500;font-size:14px}
header.cab button.on{color:var(--acc);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:128px;background:none;border:0;border-radius:0;color:var(--mut);padding:10px 2px;font-size:12px;font-weight:500}
nav.tabs button.on{color:var(--acc);font-weight:700}
nav.tabs span{display:block;font-size:20px}
.sc{overflow-x:auto;margin:8px 0}table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child,.izq{text-align:left}
td.concepto{white-space:normal;min-width:180px;text-align:left}
tfoot th{border-top:2px solid var(--ink)}
.solo-imprimir{display:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media print{
  :root{--bg:#fff;--surf:#fff;--ink:#000;--mut:#444;--line:#bbb;--acc:#000;--ok:#000;--bad:#000;color-scheme:light}
  body{padding:0;font-size:12px}main{max-width:none;padding:0}
  .demo,header.cab,nav.tabs,.no-print,button,form{display:none!important}
  .solo-imprimir{display:block}.sc{overflow:visible}td.concepto{min-width:0}
}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
/* =====================================================================
   Trilla de café · versión de demostración en un solo archivo.
   Reproduce la app construida (fases 1 a 5) con datos de ejemplo que se
   guardan solo en este navegador. La app real usa Supabase, cuentas con
   correo y contraseña, y verificación en dos pasos validada en el servidor.
   ===================================================================== */
const K = 'trilla-demo-v1', KS = 'trilla-demo-sesion', KE = 'trilla-demo-equipo'
const CUPO = 15, CODIGO_DEMO = '123456'
const $ = s => document.querySelector(s)
const uid = () => Math.random().toString(36).slice(2, 9)
const p2 = n => String(n).padStart(2, '0')
const iso = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`
const hoy = () => iso(new Date())
const haceDias = n => iso(new Date(Date.now() - n * 864e5))
const masDias = (s, n) => iso(new Date(new Date(s + 'T00:00:00').getTime() + n * 864e5))
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const nf = new Intl.NumberFormat('es', { maximumFractionDigits: 2 })
const num = n => nf.format(+n || 0)
const kg = n => num(n) + ' kg'
const pct = n => n == null || !isFinite(n) ? '—' : num(n) + '%'
const din = n => { const v = +n || 0; return (v < 0 ? '−' : '') + S.config.moneda + nf.format(Math.abs(v)) }
const fecha = s => s ? new Date(s.slice(0, 10) + 'T00:00:00').toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'
const leer = t => { const l = String(t ?? '').trim().replace(/\s/g, '').replace(',', '.'); return /^\d+(\.\d+)?$/.test(l) ? +l : NaN }
const sum = (a, fn) => a.reduce((x, y) => x + fn(y), 0)
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
const cargar = k => { try { return JSON.parse(localStorage.getItem(k)) } catch (e) { return null } }

const ROL = { admin: 'Administrador', operador: 'Operador', consulta: 'Consulta' }
const DESC = {
  admin: 'Todo: registros, pagos, tarifas, reportes y usuarios.',
  operador: 'Registra recibos, entregas y clientes. No ve precios ni pagos.',
  consulta: 'Ve precios, cobros, pagos y reportes. No registra nada.',
}
const PERM = {
  registrar: ['admin', 'operador'], dinero: ['admin', 'consulta'], pagos: ['admin'], clientes: ['admin', 'operador'],
  tarifa: ['admin'], usuarios: ['admin'], reportes: ['admin', 'consulta'], anular: ['admin'],
}
const METODOS = { efectivo: 'Efectivo', transferencia: 'Transferencia', cheque: 'Cheque', otro: 'Otro' }

/* ---------- Datos de ejemplo ---------- */
function codigosNuevos() {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
  return Array.from({ length: 10 }, () => Array.from({ length: 10 }, () => a[Math.floor(Math.random() * a.length)]).join('').replace(/^(.{5})/, '$1-'))
}
function semilla() {
  const r = (id, cli, dias, kgP, tarifa, entrega) => ({
    id, cliente: cli, fecha: haceDias(dias), kg: kgP, tarifa, anulado: false, motivo: null, creado: Date.now() - dias * 864e5,
    entregas: entrega ? [{ id: id + 'e', fecha: haceDias(entrega[0]), kg: entrega[1], anulada: false }] : [],
  })
  const recibos = [
    r('r1', 'c1', 52, 2760, 380, [49, 2230]), r('r2', 'c2', 45, 1150, 380, [43, 910]), r('r3', 'c3', 38, 5520, 400, [34, 4460]),
    r('r4', 'c4', 30, 3200, 400, [27, 2590]), r('r5', 'c5', 21, 4100, 400, [18, 3320]), r('r6', 'c1', 15, 1980, 400, [12, 1600]),
    r('r7', 'c2', 10, 860, 400, null), r('r8', 'c2', 9, 860, 400, [6, 690]), r('r9', 'c3', 5, 2400, 400, null),
    r('r10', 'c4', 2, 1500, 400, null), r('r11', 'c1', 1, 1840, 400, null),
  ]
  recibos[6].anulado = true; recibos[6].motivo = 'Peso mal digitado'
  const p = (id, cli, dias, monto, metodo, notas) => ({ id, cliente: cli, fecha: haceDias(dias), monto, metodo, notas: notas || '', anulado: false, motivo: null, creado: Date.now() - dias * 864e5 })
  const u = (id, nombre, email, rol, extra) => ({ id, nombre, email, rol, activo: true, pendiente: false, equipos: [], codigos: codigosNuevos(), ...extra })
  return {
    config: { tarifa: 400, moneda: '$', negocio: 'Trilla de café' },
    clientes: [
      { id: 'c1', nombre: 'Finca El Roble', tel: '310 555 0101', notas: '', activo: true },
      { id: 'c2', nombre: 'Don Mario Pérez', tel: '', notas: 'Paga a fin de mes', activo: true },
      { id: 'c3', nombre: 'Cooperativa La Loma', tel: '320 555 0199', notas: '', activo: true },
      { id: 'c4', nombre: 'Hacienda Santa Rita', tel: '311 555 0144', notas: '', activo: true },
      { id: 'c5', nombre: 'Asociación El Mirador', tel: '', notas: 'Entrega los lunes', activo: true },
    ],
    recibos,
    pagos: [
      p('p1', 'c1', 48, 1000000, 'transferencia'), p('p2', 'c2', 40, 437000, 'efectivo'), p('p3', 'c3', 30, 1200000, 'transferencia'),
      p('p4', 'c4', 20, 800000, 'transferencia', 'Abono'), p('p5', 'c5', 15, 1640000, 'transferencia'), p('p6', 'c3', 8, 600000, 'cheque'),
      p('p7', 'c1', 3, 500000, 'efectivo'),
    ],
    usuarios: [
      u('u1', 'Ana Martínez', 'ana@trilladora.co', 'admin', { equipos: [{ id: 'otro-1', nombre: 'Chrome en Windows (oficina)', creado: haceDias(20), vence: masDias(haceDias(20), 90), revocado: null }] }),
      u('u2', 'Óscar Ramírez', 'oscar@trilladora.co', 'operador'),
      u('u3', 'Carla Gómez', 'carla@trilladora.co', 'consulta'),
      u('u4', 'Luis Pérez', 'luis@trilladora.co', 'operador'),
      u('u5', 'María Restrepo', 'maria@trilladora.co', 'operador', { pendiente: true }),
      u('u6', 'Jorge Díaz', 'jorge@trilladora.co', 'consulta', { activo: false }),
    ],
    auditoria: [
      { cuando: Date.now() - 10 * 864e5, quien: 'Ana Martínez', que: 'Anuló un recibo de Don Mario Pérez (860 kg): Peso mal digitado' },
      { cuando: Date.now() - 35 * 864e5, quien: 'Ana Martínez', que: 'Cambió la tarifa de $380 a $400 por kg' },
    ],
    intentos: {},
  }
}

let S = cargar(K) || semilla()
let ses = cargar(KS) || { usuario: null, verificado: false }
let EQUIPO = cargar(KE)
if (!EQUIPO) { EQUIPO = 'eq-' + uid(); guardar(KE, EQUIPO) }
const UI = {
  vista: 'resumen', id: null, msg: null, abierto: null, editTarifa: false, editCliente: false, codigosVisibles: false, modoRecuperar: false,
  filtro: { cliente: '', estado: 'todos', desde: '', hasta: '', anulados: false },
  buscar: '', inactivos: false, periodo: periodoDe('mes'), periodoEC: periodoDe('todo'),
}
const persistir = () => { guardar(K, S); guardar(KS, ses) }

/* ---------- Reglas ---------- */
const yo = () => S.usuarios.find(u => u.id === ses.usuario && u.activo && !u.pendiente) || null
const puede = p => !!yo() && PERM[p].includes(yo().rol)
const cliente = id => S.clientes.find(c => c.id === id) || { nombre: '—' }
const entrega = r => r.entregas.find(e => !e.anulada) || null
const vigentes = () => S.recibos.filter(r => !r.anulado)
const cobro = r => r.kg * r.tarifa
const auditar = que => S.auditoria.unshift({ cuando: Date.now(), quien: yo()?.nombre || 'Sistema', que })
function cuenta(cid, hasta) {
  const rs = vigentes().filter(r => r.cliente === cid && (!hasta || r.fecha <= hasta))
  const ps = S.pagos.filter(p => !p.anulado && p.cliente === cid && (!hasta || p.fecha <= hasta))
  const cobrado = sum(rs, cobro), pagado = sum(ps, p => p.monto)
  return { cobrado, pagado, saldo: cobrado - pagado }
}
function resumen() {
  const rs = vigentes(), pend = rs.filter(r => !entrega(r)), entr = rs.filter(r => entrega(r))
  const trillado = sum(entr, r => r.kg), oro = sum(entr, r => entrega(r).kg)
  const porCobrar = sum(S.clientes, c => cuenta(c.id).saldo)
  return { recibido: sum(rs, r => r.kg), pend, enProceso: sum(pend, r => r.kg), trillado, oro, rend: trillado ? oro / trillado * 100 : null, porCobrar }
}
const equipoConfiable = u => u.equipos.find(e => e.id === EQUIPO && !e.revocado && e.vence >= hoy()) || null
function periodoDe(clave) {
  const d = new Date()
  if (clave === 'mes') return { clave, desde: iso(new Date(d.getFullYear(), d.getMonth(), 1)), hasta: hoy() }
  if (clave === 'mesAnterior') return { clave, desde: iso(new Date(d.getFullYear(), d.getMonth() - 1, 1)), hasta: iso(new Date(d.getFullYear(), d.getMonth(), 0)) }
  if (clave === 'tres') return { clave, desde: haceDias(90), hasta: hoy() }
  if (clave === 'anio') return { clave, desde: d.getFullYear() + '-01-01', hasta: hoy() }
  return { clave: 'todo', desde: '', hasta: '' }
}
const describir = r => r.desde && r.hasta ? `Del ${fecha(r.desde)} al ${fecha(r.hasta)}` : r.desde ? `Desde el ${fecha(r.desde)}` : r.hasta ? `Hasta el ${fecha(r.hasta)}` : 'Todo el historial'
const enRango = (f, r) => (!r.desde || f >= r.desde) && (!r.hasta || f <= r.hasta)

/* ---------- Piezas de interfaz ---------- */
const aviso = () => UI.msg ? `<p class="aviso ${UI.msg.tipo}" role="status">${esc(UI.msg.texto)}</p>` : ''
const decir = (texto, tipo = 'ok') => { UI.msg = { texto, tipo } }
const opcionesClientes = (sel, soloActivos) => S.clientes.filter(c => !soloActivos || c.activo).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')
function selectorPeriodo(clave) {
  const r = UI[clave]
  const ops = [['mes', 'Este mes'], ['mesAnterior', 'Mes anterior'], ['tres', 'Últimos 3 meses'], ['anio', 'Este año'], ['todo', 'Todo el historial'], ['otro', 'Otro periodo']]
  return `<div class="filtros no-print">
    <select aria-label="Periodo" data-periodo="${clave}">${ops.map(([v, t]) => `<option value="${v}" ${r.clave === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label class="f">Desde<input type="date" value="${r.desde}" data-periodo-campo="${clave}" data-campo="desde"></label>
    <label class="f">Hasta<input type="date" value="${r.hasta}" data-periodo-campo="${clave}" data-campo="hasta"></label></div>`
}
function filaRecibo(r, conCliente) {
  const e = entrega(r), d = puede('dinero')
  const cab = `<div class="split"><span>${conCliente ? esc(cliente(r.cliente).nombre) : 'Recibo del ' + fecha(r.fecha)}<small>${conCliente ? fecha(r.fecha) : ''}${d ? (conCliente ? ' · ' : '') + 'cobro ' + din(cobro(r)) + ' (' + din(r.tarifa) + '/kg)' : ''}</small></span><b class="num">${kg(r.kg)} perg.</b></div>`
  let cuerpo
  if (r.anulado) cuerpo = `<small class="bad">Anulado: ${esc(r.motivo)}</small>`
  else if (e) cuerpo = `<div class="split"><small class="ok">Entregado el ${fecha(e.fecha)}: ${kg(e.kg)} de oro, rendimiento ${pct(e.kg / r.kg * 100)}${d ? ', ' + din(cobro(r) / e.kg) + ' por kg de oro' : ''}</small>${puede('anular') ? `<button class="link no-print" data-act="anularEntrega" data-id="${r.id}">Anular entrega</button>` : ''}</div>`
  else cuerpo = (puede('registrar')
    ? `<form class="inl" data-form="entrega" data-id="${r.id}"><input name="kg" inputmode="decimal" autocomplete="off" placeholder="kg de oro obtenidos" aria-label="Kg de oro"><input type="date" name="fecha" value="${hoy()}" min="${r.fecha}" max="${hoy()}" aria-label="Fecha de entrega"><button class="ghost">Registrar entrega</button></form>`
    : '<small class="sub0">En proceso</small>') + (puede('anular') ? `<button class="link no-print" data-act="anularRecibo" data-id="${r.id}">Anular recibo</button>` : '')
  return `<div class="bloque ${r.anulado ? 'tachado' : ''}">${cab}${cuerpo}</div>`
}
function filaPago(p, conCliente) {
  return `<div class="row ${p.anulado ? 'tachado' : ''}"><span>${conCliente ? esc(cliente(p.cliente).nombre) : 'Pago del ' + fecha(p.fecha)}<small>${conCliente ? fecha(p.fecha) + ' · ' : ''}${METODOS[p.metodo]}${p.notas ? ' · ' + esc(p.notas) : ''}</small>${p.anulado ? `<small class="bad">Anulado: ${esc(p.motivo)}</small>` : puede('anular') ? `<button class="link no-print" data-act="anularPago" data-id="${p.id}">Anular pago</button>` : ''}</span><b class="num ok">${din(p.monto)}</b></div>`
}
function nombreEquipo() {
  const ua = navigator.userAgent
  const so = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'equipo'
  const nav = /Edg\//.test(ua) ? 'Edge' : /Firefox/.test(ua) ? 'Firefox' : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'Navegador'
  return `${nav} en ${so}`
}

/* ---------- Pantallas de acceso ---------- */
function vEntrada() {
  const activos = S.usuarios.filter(u => u.activo && !u.pendiente)
  return `<main class="centro"><h1>Trilla de café</h1>
  <p class="sub">Demostración con datos de ejemplo. Elige con qué persona entrar para ver lo que permite cada rol.</p>
  ${aviso()}

function movimientosEstado(cid, r) {
  const saldoInicial = r.desde ? cuenta(cid, masDias(r.desde, -1)).saldo : 0
  const movs = [
    ...vigentes().filter(x => x.cliente === cid && enRango(x.fecha, r)).map(x => { const e = entrega(x); return { fecha: x.fecha, orden: 1, creado: x.creado, concepto: `Trilla de ${kg(x.kg)} de pergamino a ${din(x.tarifa)}/kg · ${e ? kg(e.kg) + ' de oro (' + pct(e.kg / x.kg * 100) + ')' : 'en proceso'}`, cargo: cobro(x), abono: null } }),
    ...S.pagos.filter(p => !p.anulado && p.cliente === cid && enRango(p.fecha, r)).map(p => ({ fecha: p.fecha, orden: 2, creado: p.creado, concepto: `Pago (${METODOS[p.metodo]})${p.notas ? ' · ' + p.notas : ''}`, cargo: null, abono: p.monto })),
  ].sort((a, b) => a.fecha.localeCompare(b.fecha) || a.orden - b.orden || a.creado - b.creado)
  let s = saldoInicial
  movs.forEach(m => { s += (m.cargo || 0) - (m.abono || 0); m.saldo = s })
  return { saldoInicial, movs, final: s, cargos: sum(movs, m => m.cargo || 0), abonos: sum(movs, m => m.abono || 0) }
}

/* ---------- Descargas (CSV que abre Excel) ---------- */
function descargarCSV(nombre, filas) {
  const celda = v => { if (v == null) return ''; if (typeof v === 'number') return String(Math.round(v * 100) / 100).replace('.', ','); const s = String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s }
  const texto = '﻿' + filas.map(f => f.map(celda).join(';')).join('\r\n')
  const url = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }))
  const a = Object.assign(document.createElement('a'), { href: url, download: nombre })
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000)
}
const slug = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')

const F = {

    const cod = String(d.codigo || '').trim()

  if (t.matches('[data-vercomo]')) { if (t.value) entrarComo(t.value); return }
  if (t.matches('[data-filtro]')) { UI.filtro[t.dataset.filtro] = t.type === 'checkbox' ? t.checked : t.value; return render() }
  if (t.matches('[data-periodo]')) { if (t.value !== 'otro') UI[t.dataset.periodo] = periodoDe(t.value); else UI[t.dataset.periodo].clave = 'otro'; return render() }
  if (t.matches('[data-periodo-campo]')) { const p = UI[t.dataset.periodoCampo]; p[t.dataset.campo] = t.value; p.clave = 'otro'; return render() }
  if (t.matches('[data-rol]')) {
    const u = S.usuarios.find(x => x.id === t.dataset.rol)
    if (!confirm(`¿Cambiar el rol de ${u.nombre} a ${ROL[t.value]}?`)) return render()
    auditar(`Cambió el rol de ${u.nombre} de ${ROL[u.rol]} a ${ROL[t.value]}`); u.rol = t.value; decir('Rol actualizado.'); persistir(); render()
  }
})
document.addEventListener('input', e => {
  if (e.target.closest('#calc')) calc()
  if (e.target.matches('[data-buscar]')) { UI.buscar = e.target.value; const pos = e.target.selectionStart; render(); const i = $('[data-buscar]'); i.focus(); i.setSelectionRange(pos, pos) }
})
render()
</script>
</body>
</html>
